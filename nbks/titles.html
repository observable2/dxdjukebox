<!doctype html>
<notebook theme="air">
  <title>DxDJ</title>
  <script id="1" type="module">
    import {repo} from "./config.js";
    import {watchCurrent, FIELDS} from "./lib.js";

    const heading = page.querySelector("#heading");
    const fields = page.querySelector("#fields");
    const message = page.querySelector("#message");

    function showItem(item) {
      message.style.display = "none";
      heading.style.display = "";
      fields.style.display = "grid";
      heading.textContent = item.title;
      fields.replaceChildren();
      for (const f of FIELDS) {
        if (f.key === "title" || !item[f.key]) continue;
        const dt = document.createElement("dt");
        dt.style.fontWeight = "600";
        dt.textContent = f.label;
        const dd = document.createElement("dd");
        dd.style.margin = "0";
        dd.style.whiteSpace = "pre-wrap";
        if (f.key === "url") {
          const a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = item.url;
          dd.append(a);
        } else {
          dd.textContent = item[f.key];
        }
        fields.append(dt, dd);
      }
    }
    function showMessage(text, isError) {
      heading.style.display = "none";
      fields.style.display = "none";
      message.style.color = isError ? "crimson" : "#666";
      message.textContent = text;
      message.style.display = "flex";
    }

    watchCurrent(repo,
      (item) => (item ? showItem(item) : showMessage("Nothing scheduled right now.", false)),
      (error) => showMessage(error, true));
  </script>
  <script id="2" type="text/html" output="page">
    <div style="font:15px system-ui;max-width:720px">
      <h2 id="heading" style="margin-bottom:4px;display:none"></h2>
      <dl id="fields" style="display:none;grid-template-columns:max-content 1fr;gap:6px 16px"></dl>
      <div id="message" style="width:100%;height:90vh;display:none;align-items:center;justify-content:center;text-align:center;font:16px system-ui"></div>
    </div>
  </script>
</notebook>
