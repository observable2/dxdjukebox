<!doctype html>
<notebook theme="stark">
  <title>DxDJ</title>
  <script id="1" type="module" hidden="">
    import {repo} from "./config.js";
    import {watchCurrent, screenRefFromURL, screenQuery} from "./lib.js";

    const frame = page.querySelector("#frame");
    const video = page.querySelector("#video");
    const message = page.querySelector("#message");
    const siteLink = page.querySelector("#site-link");

    // A URL whose path ends in a video file extension is played in <video>; anything else goes in the iframe.
    // Also a path ending in a bare format folder like Brown Digital Repository's .../MP4/ (served as video/mp4, no extension).
    const isVideo = (url) => /(\.(mp4|m4v|webm|mov|ogv)|\/(mp4|m4v|webm|mov|ogv)\/?)$/i.test(url.split(/[?#]/)[0]);
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    // Once the viewer interacts, a muted desktop video gets its sound (autoplay rules now allow it).
    for (const type of ["pointerdown", "keydown"]) {
      addEventListener(type, () => { if (!isMobile && video.getAttribute("src") && video.muted) video.muted = false; }, {capture: true});
    }
    // Stops and empties both players so the one not in use is neither visible nor playing in the background.
    function stopAll() {
      frame.style.display = "none";
      frame.removeAttribute("src");
      video.pause();
      video.style.display = "none";
      video.removeAttribute("src");
      video.load();
    }

    function showItem(item) {
      stopAll();
      message.style.display = "none";
      if (isVideo(item.url)) {
        // Set as properties, not just markup attributes: a <video> built from the page template can lose its muted state,
        // and iOS refuses to autoplay (silently, showing nothing) unless it is muted and playsInline.
        video.playsInline = true;
        video.controls = false;
        video.src = item.url;
        video.title = item.title;
        video.style.display = "block";
        // Desktop tries sound first; browsers refuse unmuted autoplay until the viewer has interacted with the page (or the
        // embedding site), so on refusal fall back to muted autoplay, and unmute at the first click/key/touch.
        // Mobile stays muted (it would refuse anyway). If even muted play is refused (e.g. iOS Low Power Mode), show controls.
        video.muted = isMobile;
        video.play().catch(() => {
          video.muted = true;
          video.play().catch(() => { video.controls = true; });
        });
      } else {
        frame.src = item.url;
        frame.title = item.title;
        frame.style.display = "block";
      }
    }
    // Set from the poll once the screen is known: screen 4 (slug "gallery") is the Distributed Gallery
    let isGallery = false;
    function showMessage(text, isError) {
      stopAll();
      message.style.color = isError ? "crimson" : "#666";
      if (isGallery && !isError) {
        const h3 = document.createElement("h3");
        h3.textContent = "The Distributed Gallery";
        message.replaceChildren(h3);
      } else {
        message.textContent = text;
      }
      message.style.display = "flex";
    }

    // A video that cannot be loaded or decoded (bad link, hotlinking refused, unsupported codec) gets the same
    // quiet message as an empty schedule. The check on "src" ignores the error stopAll() could trigger by emptying it.
    video.addEventListener("error", () => {
      if (video.getAttribute("src")) showMessage("The DxD Jukebox “Screen” • This video could not be played.", false);
    });

    watchCurrent(repo,
      (item) => (item ? showItem(item) : showMessage("The DxD Jukebox “Screen” • Nothing is scheduled at this time.", false)),
      (error) => showMessage(error, true),
      undefined,
      // The Titles link is hidden until the screen is known, then shown or hidden by that screen's "Show Titles link" setting
      // (Admin), and goes to the Titles page for this same screen (no ?s= for screen 1).
      (info) => {
        isGallery = info.screen.number === 4 || info.screen.slug === "gallery";
        siteLink.style.display = info.screen.showTitlesLink ? "" : "none";
        siteLink.querySelector("a").href = "https://dxdj.programmatology.com/" + screenQuery(info.screen);   // screen 1: no query
      },
      screenRefFromURL());   // ?s=2 or ?s=lobby picks the screen; none = the lowest-numbered
  </script>
  <script id="2" type="text/html" output="page">
    <style>
      /* Each player fills the whole viewport (the embedding iframe, or the browser window), whatever its shape: no vh/vw arithmetic. */
      #frame, #video, #message {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #site-link {
        position: fixed;   /* fixed, not absolute: stays in the viewport corner even when the page scrolls */
        right: 1em;
        bottom: 0.75em;
        font-family: var(--serif);   /* Source Serif 4, loaded in custom.tmpl */
        font-size: 0.7em;
      }
      #site-link a {
        color: #888;   /* quiet but legible; same gray as the Titles labels */
      }
    </style>
    <div>
      <iframe id="frame" style="border:0;display:none" referrerpolicy="no-referrer" allow="fullscreen; autoplay"></iframe>
      <!-- muted + playsinline are what let browsers autoplay; loop repeats until the schedule moves on; contain = letterboxed, never cropped -->
      <video id="video" autoplay muted loop playsinline style="display:none;object-fit:contain;background:#000"></video>
      <div id="message" style="display:none;align-items:center;justify-content:center;text-align:center;"></div>
    </div>
    <div id="site-link" style="display:none"><a href="https://dxdj.programmatology.com" target="_top">dxdj.programmatology.com</a></div>
  </script>
</notebook>
