<!doctype html>
<notebook theme="air">
  <title>DxDJ</title>
  <script id="1" type="module" hidden="">
    import {repo} from "./config.js";
    import {watchCurrent} from "./lib.js";

    const frame = page.querySelector("#frame");
    const message = page.querySelector("#message");

    function showItem(item) {
      message.style.display = "none";
      frame.src = item.url;
      frame.title = item.title;
      frame.style.display = "block";
    }
    function showMessage(text, isError) {
      frame.style.display = "none";
      frame.removeAttribute("src");
      message.style.color = isError ? "crimson" : "#666";
      message.textContent = text;
      message.style.display = "flex";
    }

    watchCurrent(repo,
      (item) => (item ? showItem(item) : showMessage("The DxD Jukebox “Screen” : Nothing showing at the moment.", false)),
      (error) => showMessage(error, true));
  </script>
  <script id="2" type="text/html" output="page">
    <div>
      <iframe id="frame" style="width:100%;height:90vh;border:0;display:none" referrerpolicy="no-referrer" allow="fullscreen; autoplay"></iframe>
      <div id="message" style="width:100%;height:90vh;display:none;align-items:center;justify-content:center;text-align:center;font:16px system-ui"></div>
    </div>
  </script>
</notebook>
