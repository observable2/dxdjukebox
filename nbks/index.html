<!doctype html>
<notebook theme="stark">
  <title>DxDJ</title>
  
  <script id="1" type="module">
    import {repo} from "./config.js";
    import {watchCurrent, FIELDS} from "./lib.js";

    const heading = page.querySelector("#heading");
    const fields = page.querySelector("#fields");
    const message = page.querySelector("#message");

    function showItem(item) {
      message.style.display = "none";
      heading.style.display = "";
      heading.style.fontStyle = "italic";
      fields.style.display = "grid";
      heading.textContent = item.title;
      // Cell 2 decides which fields appear: a field is shown only if the markup has a
      // <dd id="{key}Value"> for it (and optionally a <dt id="{key}"> holding its label).
      // The loop only injects values; it never creates dt/dd elements.
      for (const f of FIELDS) {
        const dd = fields.querySelector(`#${f.key}Value`);
        if (!dd) continue;
        const dt = fields.querySelector(`#${f.key}`);
        const value = f.key === "title" || (f.key === "url" && item.hideURL) ? "" : item[f.key];
        const show = value ? "" : "none";
        dd.style.display = show;
        if (dt) dt.style.display = show;
        if (!value) continue;
        if (f.key === "url" || f.key === "furtherInfoURL") {
          const a = document.createElement("a");
          a.href = value;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = value;
          dd.replaceChildren(a);
        } else {
          dd.textContent = value;
        }
      }
    }
    function showMessage(text, isError) {
      heading.style.display = "none";
      fields.style.display = "none";
      message.style.color = isError ? "crimson" : "#666";
      message.textContent = text;
      message.style.display = "flex";
    }

    watchCurrent(repo,
      (item) => (item ? showItem(item) : showMessage("Nothing is scheduled at this time.", false)),
      (error) => showMessage(error, true));
  </script>

  <script id="2" type="text/html" output="page">
    <style>
      #titles dt {
        text-align: right;
        font-style: italic;
        line-height: 1;   /* deliberately tighter than dd */
        font-variant: small-caps;
        color: #888;
      }
      #titles dd {
        margin: 0;
        line-height: 1.25;   /* tighter than the page default of 1.5 */
        white-space: pre-wrap;
        overflow-wrap: anywhere;   /* long URLs and other unbroken text wrap instead of forcing horizontal scroll */
      }
      #titles {
        /* rem, not em, so the heading (a different font size) lines up with the dd column */
        --label-col: 9rem;   /* a bit wider than the longest one-line label, "Composition media" */
        --label-gap: 16px;
        padding: 5vw;
        max-width: 720px;
      }
      #fields {
        display: none;
        /* fixed label column: a bit wider than the longest wrapped label ("and Thanks" in #credits) */
        grid-template-columns: var(--label-col) minmax(0, 1fr);
        gap: 6px var(--label-gap);
      }
      #heading {
        margin-left: calc(var(--label-col) + var(--label-gap));   /* left edge of the dd column */
        font-family: var(--serif);   /* Source Serif 4, loaded in custom.tmpl */
        font-weight: 500;
        text-transform: uppercase;   /* display only; the stored title is unchanged */
        letter-spacing: 0;   /* a little air between the letters: try e.g. 0.05em */
      }
      #message {
        display: none;
        width: 100%;
        height: 90vh;
        height: 90dvh;   /* visible height on mobile browsers with a collapsing address bar; vh above is the fallback */
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #site-link {
        position: fixed;   /* fixed, not absolute: stays in the viewport corner even when the page scrolls */
        right: 1em;
        bottom: 0.75em;
        font-family: var(--serif);   /* Source Serif 4, loaded in custom.tmpl */
        font-size: 0.7em;
      }
      #site-link a {
        color: #888;   /* quiet but legible; same gray as the labels above */
      }
      /* narrow screens: no room for a side label column, so each label sits above its value */
      @media (max-width: 480px) {
        #titles {
          --label-col: 0px;
          --label-gap: 0px;
        }
        #fields {
          grid-template-columns: minmax(0, 1fr);
          gap: 0;
        }
        #titles dt {
          text-align: left;
          padding-top: 0.75em;   /* padding, not margin: custom.tmpl forces margin-top:0 !important on everything */
        }
        #titles dt:empty {
          display: none;
        }
      }
    </style>

    <div id="titles">
      <h3 style="color: #666;margin-bottom: 2em;">DxD Jukebox &nbsp;•&nbsp; What’s Showing</h3>
      <h2 id="heading" style="margin-bottom: 2em;"></h2>
      <dl id="fields">
        <dt id="authorship"></dt><dd id="authorshipValue"></dd>
        <dt id="url"></dt><dd id="urlValue"></dd>
        <dt id="yearCreated"></dt><dd id="yearCreatedValue"></dd>
        <dt id="whereCreated"></dt><dd id="whereCreatedValue"></dd>
        <dt id="media">Composition media</dt><dd id="mediaValue"></dd>
        <dt id="license">License</dt><dd id="licenseValue"></dd>
        <dt id="duration">Duration</dt><dd id="durationValue" style="font-family: var(--monospace); font-size: .8em;"></dd>
        <dt id="notes"></dt><dd id="notesValue"></dd>
        <dt id="furtherInfoURL">Further Information</dt><dd id="furtherInfoURLValue"></dd>
        <dt id="course">Course</dt><dd id="courseValue"></dd>
        <dt id="mentor">Advisors</dt><dd id="mentorValue"></dd>
        <dt id="credits">References<br>&amp; thanks</dt><dd id="creditsValue"></dd>
      </dl>
      <div id="message"></div>
    </div>
    <div id="site-link"><a href="https://dxdj.programmatology.com/screen">Screen</a></div>
  </script>
</notebook>
