<!doctype html>
<notebook theme="air">
  <title>DxD Jukebox — Screen</title>
  <script id="1" type="module">
    import {repo} from "./config.js";
    import {watchCurrent} from "./lib.js";

    const current = Generators.observe((change) =>
      watchCurrent(repo, (item) => change({item}), (error) => change({error, item: null}))
    );
  </script>
  <script id="2" type="text/html">
    ${current.error ? html`<p style="color:crimson">${current.error}</p>`
    : current.item ? html`<iframe src=${current.item.url} title=${current.item.title} style="width:100%;height:90vh;border:0" referrerpolicy="no-referrer" allow="fullscreen; autoplay"></iframe>`
    : html`<p style="font:16px system-ui;color:#666;text-align:center;padding:4em 0">Nothing scheduled right now.</p>`}
  </script>
</notebook>
