<!doctype html>
<notebook theme="stark">
  <title>DxDJ Admin</title>
  <script id="1" type="module">
    import {repo} from "./config.js";
    import {mountAdmin} from "./admin.js";
    import {markdownFragment} from "./lib.js";
    import {marked} from "npm:marked@15.0.12";

    mountAdmin(page, repo, html, (text) => markdownFragment(marked, text));
  </script>

  <script id="3" type="text/html">
    <div style="padding-top: 5vw;padding-left: 5vw;">
      <h3 style="color: #666;">DxD Jukebox • Admin Page</h3>
    </div>
  </script>

  <script id="2" type="text/html" output="page">
    <div id="admin" style="width:100%;padding:3vw;"></div>
  </script>
</notebook>
